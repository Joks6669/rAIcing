[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raicing"
version = "0.1.0"
description = "AI Racing League — simulation engine, training lab, league services and director CLI"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.5",
  "typer>=0.12",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
lab = ["torch>=2.2", "gymnasium>=0.29", "pettingzoo>=1.24", "stable-baselines3>=2.3"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "psycopg[binary]>=3.1", "websockets>=12", "httpx>=0.27"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
paddock = "raicing.cli.paddock:app"
stewards = "raicing.cli.stewards:app"

[tool.setuptools.packages.find]
include = ["raicing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
